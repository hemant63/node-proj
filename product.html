<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link rel="stylesheet" href="product.css">
</head>
<body>
    <div>
        <div class="modal js-modal">
                <div class="modal-overlay "></div>
                <div class="modal-content">
            <div class="modal-header">
                <h2>Add your product</h2>
                <div><image src="close.png" class="close js-close-modal" alt="close" height="16px"></div>
            </div>
            <form>
                <label htmlfor="title">Title:</label>
                <input type="text" name="title" class="input"/><br>
                <label htmlfor="title">Description:</label>
                <textarea rows="10" name="description" class="input" placeholder="Tell about your product..."></textarea><br>
                <label htmlfor="title">Price:</label>
                <input type="text" name="price" class="input"/><br>
                <label htmlfor="title">Image:</label>
                <input type="file" name="image" class="input" />
                <input type="text" name="image" class="input" placeholder="Image url"/><br><br>
                <input type="button" id="btn" value="Add" />
            </form>
            </div>
        </div>
        <div id="product">
            <div id="header">
                <h1>Items</h1>
                <div>
                <a href="./cart.html" id="cart">Cart</a>
                    <button id="btn" class="js-show-modal">Add Product</button></div>
                
            </div>
            <table id="table">
                <tbody id="tbody">
                </tbody>
            </table>
        </div>
    </div>
    <!-- <script src="async.js"></script> -->
    <script src="common.js"></script>
    <script type="module" src="product.js"></script>
    <script type="module" src="modal.js"></script>
</body>
</html>
